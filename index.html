<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://ketua-rt.mbagasah.workers.dev/">
<title>Ketua RT · Pindah ke Alamat Baru</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ecebe8;color:#191918;font:14px/1.5 system-ui,sans-serif;text-align:center;padding:24px}
  a{color:#0075de}
</style>
</head>
<body>
<p>Memindahkan ke <a href="https://ketua-rt.mbagasah.workers.dev/">ketua-rt.mbagasah.workers.dev</a>…</p>
<script>
(async function () {
  var TARGET = 'https://ketua-rt.mbagasah.workers.dev/';
  try {
    var auto = localStorage.getItem('rt-simulator-v2-auto');
    var manual = localStorage.getItem('rt-simulator-v2-manual');
    if (!auto && !manual) { location.replace(TARGET); return; }
    var raw = JSON.stringify({ auto: auto || null, manual: manual || null });
    function b64url(bytes) {
      var bin = '';
      for (var i = 0; i < bytes.length; i += 8192) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      }
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    var hash;
    if (typeof CompressionStream === 'function') {
      var cs = new CompressionStream('gzip');
      var w = cs.writable.getWriter();
      w.write(new TextEncoder().encode(raw));
      w.close();
      var buf = new Uint8Array(await new Response(cs.readable).arrayBuffer());
      hash = 'g.' + b64url(buf);
    } else {
      hash = 'b.' + b64url(new TextEncoder().encode(raw));
    }
    location.replace(TARGET + '#migrate=' + hash);
  } catch (e) {
    location.replace(TARGET);
  }
})();
</script>
</body>
</html>
